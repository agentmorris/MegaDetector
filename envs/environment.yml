# This is a base environment that doesn't include any YOLO-specific dependencies.  Use this 
# if you plan to import YOLO dependencies from the PYTHONPATH.
name: megadetector-no-yolo

channels:
  - conda-forge

dependencies:
  - python>=3.9
  - pip
  
  - numpy>=1.26.4  
  - Pillow>=10.0.0  
  - tqdm>=4.64.0
  - jsonpickle>=3.0.0
  - humanfriendly>=10.0  
  - matplotlib>=3.8.0
  - opencv>=4.8.0
  - requests>=2.31.0
  - scikit-learn>=1.3.1
  - pandas>=2.1.1
  
  - send2trash
  - python-dateutil
  - pytest
  
  # Not used directly, but required for deserializing some models
  - dill
  
  # Not used directly, but used by YOLO libraries
  - seaborn>=0.12.2
  - PyYAML>=6.0.1
    
  # For running MegaDetector v4
  # - tensorflow>=2.0,<=2.10

  - pip:
    # PyTorch stopped publishing conda packages after 2.5.1, so torch comes from
    # pip.  The extra index URL is what gets us CUDA builds; without it, pip
    # installs CPU-only wheels on Windows.  Note that the index has to be one
    # that actually carries current builds, otherwise PyPI wins the version
    # comparison and you silently get CPU wheels anyway.
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - torch>=2.0
    - torchvision>=0.15.0

    # torch requires setuptools with no upper bound, but setuptools 82 removed
    # pkg_resources, which yolov5/utils/general.py imports at module scope.  Without
    # this pin, MDv5 inference fails with "Could not import YOLOv5 functions".  This
    # mirrors the pin in pyproject.toml.
    - setuptools<82

    # fastquadtree is not available on conda-forge, so it has to come from pip.
    - fastquadtree>=1.1.2
